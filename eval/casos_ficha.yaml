# Casos para evaluar la ficha (eval/evaluar_ficha.py). TODOS LOS DATOS SON INVENTADOS.
#
# Cada caso tiene el texto que "cuenta" el usuario y el valor CORRECTO de cada campo:
#   - null  = el texto no lo dice (lo correcto es que la IA lo deje vacío; no debe deducirlo)
#   - lista = cualquiera de esos valores se acepta (p. ej. "bodega" o "bodeguita")
# camino_esperado es el camino que darían las reglas con los valores correctos.

- id: C1
  prueba: "Bodega que cumple, con dirección completa y números en dígitos"
  camino_esperado: A
  texto: >-
    Tengo una bodega que se llama Bodega Doña Rosa, en mi casa, en el jirón Los Pinos 245,
    distrito de San Martín de Porres, provincia de Lima, departamento de Lima. Está en el primer
    piso, mide 28 metros cuadrados y la puerta da directo a la calle; los vecinos entran a comprar.
    Vendo unos 4500 soles al mes y compro 3200 en mercadería. No tengo RUC.
  esperado:
    giro: bodega
    tiene_local_al_publico: true
    nombre_comercial: Bodega Doña Rosa
    direccion: jirón Los Pinos 245
    distrito: San Martín de Porres
    provincia: Lima
    departamento: Lima
    area_m2: 28
    en_vivienda: true
    piso: 1
    acceso_directo_via_publica: true
    ventas_mensuales: 4500
    compras_mensuales: 3200
    tiene_ruc: false

