# Mensajes que el motor agrega a las respuestas (Bloque 2 completa esta sección).
mensajes:
  # Se agrega cuando una respuesta cita un documento que tiene "nota_fecha" (material de SUNAT).
  nota_fecha_sunat: >-
    Este dato viene de material de orientación de SUNAT de {fecha}. Los montos y requisitos
    pueden haber cambiado: confírmalos en sunat.gob.pe antes de hacer el trámite.
