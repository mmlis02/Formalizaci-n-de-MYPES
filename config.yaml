# ---------------------------------------------------------------------------
# Bloque 1, paso 5: fragmentos, embeddings e índice
# ---------------------------------------------------------------------------
fragmentos:
  # Tamaño y solape en CARACTERES (no tokens). Se usa la configuración que ganó en HW_03
  # (c500_s150: mejor Recall@1 y mejor separación dentro/fuera del corpus).
  configuraciones:
    c500_s150: {tamano: 500, solape: 150}
  elegida: c500_s150
  # Texto corto que se antepone a cada fragmento al calcular su embedding (no cambia el texto citado).
  nombres_cortos:
    ley30877: "Ley 30877, Ley General de Bodegueros"
    ley31866: "Ley 31866 que modifica la Ley General de Bodegueros (licencia provisional virtual)"
    ds010_2020_produce: "Reglamento de la Ley General de Bodegueros (D.S. 010-2020-PRODUCE)"
    ds003_2024_produce: "D.S. 003-2024-PRODUCE que modifica el Reglamento de la Ley General de Bodegueros"
    tupa_bodegas: "Formato TUPA: licencia provisional de funcionamiento para bodegas"
    tuo_ley28976: "TUO de la Ley Marco de Licencia de Funcionamiento (Ley 28976)"
    tupa_riesgo_bajo: "Formato TUPA: licencia de funcionamiento para negocios de riesgo bajo"
    sunat_nuevo_rus: "SUNAT: Nuevo RUS (orientación 2020)"
    sunat_formalizar_negocio: "SUNAT: cómo formalizar tu negocio, RUC y regímenes tributarios (orientación 2020)"

embeddings:
  # Solo embeddings por API: así el despliegue no necesita torch ni sentence-transformers.
  modelo_activo: openai
  modelos:
    openai:
      tipo: openai
      nombre: text-embedding-3-small
      prefijo_consulta: ""
      prefijo_pasaje: ""
      max_tokens: 8191
      lote: 100
      alias: oai3small

indice:
  carpeta: data/index/chroma        # SÍ va a git: Streamlit Cloud no construye el índice
  prefijo_coleccion: formaliza
  lote_insercion: 64

# Precios por 1M de tokens (USD). Fuente: https://developers.openai.com/api/docs/pricing
# OpenAI no cobra distinto según la hora: una sola franja 00:00-24:00 (mismo esquema que HW_03).
precios:
  fuente: "https://developers.openai.com/api/docs/pricing"
  fecha_verificacion: "2026-11-16"
  zona_horaria: "UTC"
  modelos:
    text-embedding-3-small:
      franjas:
        - {desde: "00:00", hasta: "24:00", entrada: 0.02, entrada_cache: 0.02, salida: 0.0}
    gpt-6-luna:
      franjas:
        - {desde: "00:00", hasta: "24:00", entrada: 0.10, entrada_cache: 0.01, salida: 0.50}
    # Whisper cobra por minuto de audio, no por tokens (verificado el 2026-11-16; el modelo figura
    # como "deprecated" en la página de OpenAI, pero sigue respondiendo).
    whisper-1:
      franjas:
        - {desde: "00:00", hasta: "24:00", por_minuto: 0.006}
  log_llamadas: logs/costos_llm.csv

# ---------------------------------------------------------------------------
# Bloque 2: evaluación, motor RAG, modelo de lenguaje y prompts
# ---------------------------------------------------------------------------
evaluacion:
  preguntas: eval/preguntas.csv
  k_valores: [1, 3, 5]
  resultados: eval/resultados
  # text-embedding-3-small da similitudes más bajas que los modelos locales (en HW_03: 0.15-0.74)
  barrido: {desde: 0.20, hasta: 0.70, paso: 0.005}

motor:
  # Defensa 1 (sin IA): si la similitud del mejor fragmento es menor que esto, se abstiene SIN
  # llamar al LLM. Un umbral por modelo de embeddings (cada uno tiene su escala).
  # Regla (la misma de HW_03 para OpenAI): similitud de la pregunta legítima más baja - 0.005,
  # para no detener ninguna pregunta del corpus. Calibrado con eval/barrido_umbral.py.
  umbral_similitud:
    openai: 0.474        # D05 (legítima más baja) = 0.4793 - 0.005. Barrido del 2026-11-16 (Bloque 2)
  k_contexto: 5          # fragmentos que se entregan al LLM
  # Cómo se muestra cada cita [Fn] en la respuesta final: "(<cita corta>, pág. N)"
  citas_cortas:
    ley30877: "Ley 30877"
    ley31866: "Ley 31866"
    ds010_2020_produce: "Reglamento, D.S. 010-2020-PRODUCE"
    ds003_2024_produce: "D.S. 003-2024-PRODUCE"
    tupa_bodegas: "Formato TUPA bodegas"
    tuo_ley28976: "TUO Ley 28976"
    tupa_riesgo_bajo: "Formato TUPA riesgo bajo"
    sunat_nuevo_rus: "SUNAT, Nuevo RUS"
    sunat_formalizar_negocio: "SUNAT, ¿Cómo formalizar tu negocio?"
  # Artículos cuyo texto en este documento ya fue cambiado por OTRA norma del corpus.
  # Si una respuesta cita un fragmento de ese artículo, se agrega la nota de versión.
  articulos_modificados:
    - {documento: ley30877, articulo: "Artículo 6", norma: "la Ley N.° 31866", fecha: "11/08/2023"}
    - {documento: ds010_2020_produce, articulo: "Artículo 19", norma: "el D.S. N.° 003-2024-PRODUCE", fecha: "15/02/2024"}
    - {documento: ds010_2020_produce, articulo: "Artículo 21", norma: "el D.S. N.° 003-2024-PRODUCE", fecha: "15/02/2024"}

llm:
  proveedor: openai
  modelo: gpt-6-luna
  reasoning_effort: none      # sin razonamiento oculto: costo predecible y menor latencia
  max_tokens_salida: 700
  timeout_segundos: 60

prompts:
  sistema: |
    Eres un asistente que explica a bodegueros y pequeños emprendedores del Perú cómo
    formalizar su negocio (RUC, Nuevo RUS, licencia de funcionamiento y licencia provisional
    de bodegas). Respondes SOLO con lo que dicen los FRAGMENTOS que se te entregan.
    Reglas obligatorias:
    1. No uses conocimiento propio ni información que no esté en los fragmentos. No adivines ni
       completes con lo que "suele" decir la norma.
    2. Decide "fuera_de_corpus" así:
       - true: los fragmentos NO contienen el dato central que se pregunta (la cifra, el plazo,
         el requisito o la regla concreta) y solo mencionan el tema de pasada. Explica en
         "explicacion_limite" qué dice el corpus y qué falta.
       - false: los fragmentos responden la pregunta, aunque sea en parte. Responde con lo que sí
         dicen y, si falta algún detalle, dilo en "explicacion_limite". No te abstengas solo
         porque falten detalles secundarios.
       Las preguntas pueden venir en lenguaje cotidiano ("mi bodeguita", "cuánto le pago a la
       SUNAT"): relaciónalas con los términos legales equivalentes antes de decidir.
       "explicacion_limite" es SOLO para información que falta en los fragmentos. Si la respuesta
       está completa, déjalo vacío (""). No pongas ahí notas de versión ni fechas.
    3. Cada afirmación de "respuesta" debe llevar su cita con el número de fragmento entre
       corchetes, por ejemplo [F2]. No escribas números de página: el sistema los pone.
    4. Versiones: si un fragmento dice "[Texto vigente — ... por X, publicada el F]", usa ese texto.
       La Ley 31866 y el D.S. 003-2024-PRODUCE solo traen los artículos que modifican: no los
       presentes como si fueran la ley o el reglamento completos.
    5. Escribe en español claro y sencillo, como para alguien sin formación legal, en 2 a 6 oraciones.
  usuario: |
    PREGUNTA:
    {pregunta}

    FRAGMENTOS:
    {fragmentos}

# ---------------------------------------------------------------------------
# Bloque 3: voz (Whisper) y ficha del negocio (LLM con salida estructurada + verificación)
# ---------------------------------------------------------------------------
voz:
  modelo: whisper-1
  idioma: es
  formatos: [m4a, mp3, wav, webm, ogg, mp4, mpeg, mpga]   # los que acepta la API
  tamano_max_mb: 25                                       # límite de la API de OpenAI
  # Vocabulario que ayuda a Whisper con palabras del trámite (sin nombres de lugares concretos).
  prompt: "Bodega, RUC, SUNAT, Nuevo RUS, licencia de funcionamiento, municipalidad, jirón, avenida, metros cuadrados, soles."
  mensajes:
    no_existe: "No se encontró el archivo de audio."
    formato: "Formato de audio no admitido ({formato}). Usa uno de estos: {formatos}."
    muy_grande: "El audio pesa {mb:.1f} MB; el máximo es {max_mb} MB."
    error_api: "No se pudo transcribir el audio. Intenta de nuevo o escribe tu negocio con texto."
    vacio: "No se entendió nada en el audio. Intenta grabarlo de nuevo, más cerca del micrófono."

ficha:
  # Lo que el LLM debe sacar de la transcripción. El TIPO de cada campo está en src/ficha.py;
  # aquí van la etiqueta (pantalla) y la descripción (se le da al LLM).
  # Nombre, DNI, teléfono y correo NO están aquí a propósito: los escribe el usuario en la app y
  # nunca se envían a la IA.
  campos:
    giro: {etiqueta: "Giro o actividad", descripcion: "Qué vende o a qué se dedica el negocio (por ejemplo: bodega, venta de ropa, peluquería)."}
    tiene_local_al_publico: {etiqueta: "¿Tiene local abierto al público?", descripcion: "Si atiende en un local al que entran los clientes (true) o si vende solo por redes, delivery o a pedido (false)."}
    nombre_comercial: {etiqueta: "Nombre del negocio", descripcion: "Nombre comercial del negocio, si lo dice."}
    direccion: {etiqueta: "Dirección", descripcion: "Calle, jirón o avenida y número del local."}
    distrito: {etiqueta: "Distrito", descripcion: "Distrito donde está el local."}
    provincia: {etiqueta: "Provincia", descripcion: "Provincia donde está el local."}
    departamento: {etiqueta: "Departamento", descripcion: "Departamento (región) donde está el local."}
    area_m2: {etiqueta: "Área (m²)", descripcion: "Área total del local en metros cuadrados."}
    en_vivienda: {etiqueta: "¿Está en su vivienda?", descripcion: "Si el negocio funciona dentro de la casa donde vive (true) o no (false)."}
    piso: {etiqueta: "Piso", descripcion: "En qué piso está el local (1 = primer piso, 2 = segundo piso...)."}
    acceso_directo_via_publica: {etiqueta: "¿Tiene acceso directo a la calle?", descripcion: "Si la puerta del local da directamente a la calle o vía pública (true) o no (false)."}
    ventas_mensuales: {etiqueta: "Ventas al mes (S/)", descripcion: "Cuánto vende al mes, en soles."}
    compras_mensuales: {etiqueta: "Compras al mes (S/)", descripcion: "Cuánto compra al mes (mercadería, insumos), en soles."}
    tiene_ruc: {etiqueta: "¿Tiene RUC?", descripcion: "Si ya tiene RUC (true) o no (false)."}
  estados:
    verificado: "Verificado en tu audio"
    por_confirmar: "Por confirmar: revísalo"
    no_mencionado: "No lo mencionaste"
  prompt_sistema: |
    Extraes los datos de un negocio pequeño del Perú a partir de la TRANSCRIPCIÓN de lo que
    contó su dueño. Reglas obligatorias:
    1. Usa SOLO lo que dice la transcripción. Si un dato no se menciona, su "valor" es null y su
       "cita" es "". No deduzcas nada: no completes la provincia o el departamento a partir del
       distrito, ni supongas que una bodega está en la vivienda si no lo dice.
    2. "cita" es el pedazo EXACTO de la transcripción donde aparece el dato, copiado tal cual
       (mismas palabras, sin corregir ortografía ni abreviar). Si la transcripción tiene un error
       (por ejemplo, un nombre mal escrito), copia el valor tal como está escrito.
    3. Los montos son en soles y por mes. Escribe los números con dígitos (4500, no "cuatro mil
       quinientos"). Si dice un rango o "más o menos", usa el número que dijo.
    4. Para los campos sí/no usa true o false solo si la transcripción lo dice claramente.
  prompt_usuario: |
    TRANSCRIPCIÓN:
    {transcripcion}
  mensajes:
    texto_vacio: "Cuéntame algo de tu negocio para poder llenar la ficha."
    error_api: "No se pudieron extraer los datos del negocio. Intenta de nuevo en unos minutos."

# ---------------------------------------------------------------------------
# App Streamlit (solo textos: la lógica está en src/motor_rag.py). Versión mínima de prueba;
# los 3 pasos (Cuéntame → Revisa tus datos → Tu plan) llegan en el Bloque 5.
# ---------------------------------------------------------------------------
app:
  titulo: "Formaliza"
  icono: "🏪"
  subtitulo: >-
    Pregunta sobre cómo formalizar tu bodega o negocio. Respondo solo con la Ley General de
    Bodegueros y su reglamento, la Ley Marco de Licencia de Funcionamiento, los formatos TUPA y
    material de SUNAT, citando documento y página. Si la respuesta no está ahí, te lo digo.
  aviso_legal: "Orientación informativa, no asesoría legal. Verifica siempre en la fuente oficial."
  cargando: "Cargando el índice (solo la primera vez)..."
  sin_clave: >-
    Falta la clave de OpenAI. En local, crea el archivo .env (copia .env.example); en Streamlit
    Cloud, agrégala en Settings → Secrets como OPENAI_API_KEY = "...".
  sin_indice: >-
    No se encontró el índice vectorial (data/index/). La app no lo construye: ejecuta una vez
    `python build_index.py` y vuelve a abrir la app.
  etiqueta_pregunta: "Escribe tu pregunta"
  boton_preguntar: "Preguntar"
  buscando: "Buscando en los documentos..."
  ejemplos_titulo: "Prueba con un ejemplo"
  ejemplos:
    - "Tengo mi bodeguita en la sala de mi casa, ¿hasta qué tamaño puede ser para sacar la licencia provisional?"
    - "Vendo como 4 mil soles al mes en mi tiendita, ¿cuánto tendría que pagarle a la SUNAT cada mes?"
    - "¿Cuánto cuesta registrar la marca de mi negocio en Indecopi?"
  titulo_respuesta: "Respuesta"
  abstencion_titulo: "El asistente se abstuvo"
  motivos:
    umbral: "Ningún fragmento se parece lo suficiente a la pregunta (decidido sin llamar a la IA, costo 0)."
    fuera_de_corpus: "La IA revisó los fragmentos y la respuesta no está en los documentos."
    sin_citas: "La respuesta generada no citaba ningún documento y se descartó por seguridad."
  titulo_limite: "Límite de los documentos"
  titulo_notas: "Notas de versión y de fecha"
  titulo_fuentes: "Fragmentos recuperados"
  columnas_fuentes: {documento: "Documento", pagina: "Página", articulo: "Artículo", similitud: "Similitud", citada: "¿Citado?"}
  m_abstuvo: "¿Se abstuvo?"
  "si": "Sí"
  "no": "No"
  m_similitud: "Similitud máxima"
  ayuda_umbral: "Umbral de abstención: {umbral}"
  m_costo: "Costo de la consulta"
  ayuda_costo: "{tokens_entrada} tokens de entrada / {tokens_salida} de salida · {latencia:.1f} s"
  sin_llm: "US$ 0 (no se llamó a la IA)"

# Formularios oficiales que la app llena (Bloque 4). NO van al índice: son las plantillas del PDF.
# Se descargan junto con el corpus para tener la versión exacta que se copió.
formularios:
  - id: dj_bodegas
    camino: A
    titulo: "Declaración Jurada para Licencia Provisional de Funcionamiento para Bodegas"
    archivo: formularios/dj_bodegas.pdf
    url_pdf: "https://cdn.www.gob.pe/uploads/document/file/3441919/Declaraci%C3%B3n%20jurada%20para%20licencia%20provisional%20de%20funcionamiento%20de%20bodegas.pdf.pdf"
  - id: dj_licencia_funcionamiento
    camino: B
    # No es un PDF de la PCM: es la copia del formato nacional que publicó una municipalidad en gob.pe.
    titulo: "Formato de Declaración Jurada para Licencia de Funcionamiento: copia publicada por la Municipalidad Distrital de Veintiséis de Octubre del formato nacional (Anexo 1 del D.S. N.° 163-2020-PCM)"
    archivo: formularios/dj_licencia_funcionamiento.pdf
    url_pdf: "https://cdn.www.gob.pe/uploads/document/file/6143790/5402423-formato-de-dj-para-licencia-de-funcionamiento-1.pdf"

# Mensajes del motor RAG (todo lo que ve el usuario vive aquí, no en el código).
mensajes:
  # Se agrega cuando una respuesta cita un documento que tiene "nota_fecha" (material de SUNAT).
  nota_fecha_sunat: >-
    Este dato viene de material de orientación de SUNAT de {fecha}. Los montos y requisitos
    pueden haber cambiado: confírmalos en sunat.gob.pe antes de hacer el trámite.
  abstencion_umbral: >-
    No encontré en los documentos que consulto (Ley General de Bodegueros y su reglamento, Ley
    Marco de Licencia de Funcionamiento, formatos TUPA y material de SUNAT) información
    suficientemente relacionada con tu pregunta, así que prefiero no responder antes que improvisar.
  abstencion_fuera_de_corpus: >-
    Tu pregunta está relacionada con la formalización de negocios, pero la respuesta no está en
    los documentos que consulto.
  abstencion_sin_citas: >-
    El modelo generó una respuesta sin citar ningún documento; por seguridad no se muestra.
  pregunta_vacia: "Escribe una pregunta."
  error_api: "No se pudo obtener respuesta del modelo de lenguaje. Intenta de nuevo en unos minutos."
  nota_modificado: "Texto vigente: modificado por {norma} (publicación: {fecha})."
  # Notas que se agregan cuando se cita un documento que solo modifica a otro
  notas_por_documento:
    ley31866: >-
      La Ley N.° 31866 (11/08/2023) solo modifica el artículo 6 de la Ley N.° 30877; el resto de la
      Ley General de Bodegueros sigue como en su texto original.
    ds003_2024_produce: >-
      El D.S. N.° 003-2024-PRODUCE (15/02/2024) modifica solo los artículos 19 y 21 del Reglamento
      de la Ley N.° 30877 (D.S. N.° 010-2020-PRODUCE); los demás artículos siguen vigentes.
